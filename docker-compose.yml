services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_DATABASE=dvwa
      - DB_USERNAME=dvwa
      - DB_PASSWORD=p@ssw0rd
      - RECAPTCHA_PRIV_KEY=
      - RECAPTCHA_PUB_KEY=
      - DEFAULT_SECURITY_LEVEL=low
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dvwa_net

  db:
    image: mariadb:10.11
    container_name: dvwa_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - dvwa_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dvwa_net

volumes:
  dvwa_db_data:

networks:
  dvwa_net:
    driver: bridge
